<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#159957" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/src/assets/EM_favicon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>ExpenseMate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          const swUrl = new URL("%BASE_URL%sw.js", window.location.href).toString();
          navigator.serviceWorker
            .register(swUrl)
            .then((registration) => {
              console.log("ServiceWorker registered successfully", registration);
            })
            .catch((err) => {
              console.log("ServiceWorker registration failed: ", err);
            });
        });

        // When a new service worker takes over (a fresh deploy was picked
        // up), reload once so the page never keeps running on old code.
        let hasReloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (hasReloaded) return;
          hasReloaded = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
